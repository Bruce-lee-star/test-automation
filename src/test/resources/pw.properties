# Serenity Properties —— Web 框架行为配置
# ================================================
# 配置域分工（与 pw.conf 互补，两者均由框架 FileConfigResolver 合并读取）：
#   - pw.conf  ：浏览器启动参数 / 测试环境 URL / 测试用户凭据（Playwright 相关）
#   - 本文件        ：框架行为（截图 / 上下文 / 视频 / Trace / 页面超时 / 代理 / BrowserStack 等）
# 程序侧读取入口：web 域统一经 web.config.FrameworkConfig 枚举；请勿在业务代码中用
# System.getProperty / getProperty("playwright|serenity|browserstack...") 直读 key。

# ==================== Serenity BDD ====================
# 报告项目名称（所有报告统一使用）
project.report.name=Serenity Playwright Demo

# ==================== 截图策略 ====================
# 截图模式 - BEFORE_AND_AFTER_EACH_STEP, AFTER_EACH_STEP, FOR_FAILURES, DISABLED
# BEFORE_AND_AFTER_EACH_STEP - 每步前后截图
# AFTER_EACH_STEP - 仅步后截图
# FOR_FAILURES - 仅失败时截图
framework.screenshot.strategy=AFTER_EACH_STEP

# ==================== Playwright ====================
# 截图等待超时(毫秒)
playwright.screenshot.wait.timeout=5000

# 是否全页截图（评审08类-8 / W-2：默认关闭，避免全量全页截图体积过大且含敏感区域）
# true - 全页截图
# false - 不全页截图
playwright.screenshot.fullpage=false

# ==================== Playwright SDK ====================

# ==================== 视频录制 ====================
# 是否启用视频录制
# 录屏直接落 per-case（<pw.report.output>/<outcomeId>/records/），由报告侧 videoTarget() 指导，
# 故无需再配保存目录：playwright.context.recordVideo.dir 仅在「无活动用例句柄」（如 @Before 建
# context）时作兜底，默认 target/videos，与此处显式写同值等价，故删除该行。
playwright.context.recordVideo.enabled=true

# Trace 记录（2026-10-18 开启：每用例导出 trace.zip 并挂到 v2 报告 "Play trace" 按钮）
playwright.context.trace.enabled=true

# ==================== Playwright ====================
# 页面加载超时(毫秒)
playwright.page.timeout=30000

# 页面导航超时(毫秒)
playwright.page.navigationTimeout=30000

# 等待稳定化超时(毫秒)
playwright.stabilize.wait.timeout=30000

# 元素等待时间(毫秒)
playwright.element.wait.timeout=15000

# 轮询间隔(毫秒)
# 用于各种等待方法的轮询检查间隔
playwright.polling.interval=500

# ==================== 页面加载状态 ====================
# 页面加载状态 - LOAD, DOMCONTENTLOADED, NETWORKIDLE
# LOAD - 完全加载（等所有子资源加载完才结束导航，HSBC 门户有长连接/第三方资源，load 事件常不触发 → 导航超时）
# DOMCONTENTLOADED - DOM 解析完即结束导航（推荐，后续元素交互各自 waitForVisible 等待，稳定且不易超时）
# NETWORKIDLE - 网络空闲（最稳但最慢，适合重度 SPA）
# 说明：HSBC SIT 登录门户用 LOAD 会在 30s 内因 load 事件不触发而导航超时，故默认改为 DOMCONTENTLOADED。
playwright.page.load.state=DOMCONTENTLOADED

# ==================== 功能目录 ====================
# 功能目录（决定 Cucumber 去哪里找 .feature 文件；同时回落用于报告产物目录）
framework.features.root=src/test/resources/features

# ==================== 网络代理配置 ====================
# 所有代理场景统一使用以下全局代理地址和凭据：
#   ① Context 代理 — 浏览器页面流量（User 侧）
#   ② 下载代理      — Playwright 浏览器二进制下载（CLI install）
#   ③ BrowserStack CDP 代理 — wss 连接代理
#   ④ BS Local 代理 — BrowserStackLocal 隧道代理
# 每个场景有独立的 enabled 开关，凭据统一使用全局配置。
# HTTP 和 HTTPS 各自独立配置，互不回退。

# ==================== 全局默认代理地址 ====================
# HTTP 代理地址（host:port，可含 http:// 前缀，可含 user:pass@）
# 示例: http://proxy.company.com:8888 或 http://user:pass@proxy.com:8080
playwright.proxy.http=

# HTTPS 代理地址（同格式）
playwright.proxy.https=

# 全局默认代理凭据（URL 中不含 userinfo 时使用）
playwright.proxy.http.username=
playwright.proxy.http.password=
playwright.proxy.https.username=
playwright.proxy.https.password=

# ==================== ① Context 代理 ====================
# 启用开关（注入到 BrowserContext，影响页面流量）
playwright.context.proxy.enabled=false

# ==================== ② 下载代理 ====================
# 启用开关（CLI install 时注入 HTTP_PROXY/HTTPS_PROXY 环境变量）
playwright.download.proxy.enabled=false

# 下载专属代理地址（不配置则回退全局 playwright.proxy.http/https）
playwright.browser.download.http.proxy=
playwright.browser.download.https.proxy=

# ==================== Session 配置 ====================
# Session 管理
# Session超时(分钟)
playwright.no.login.session.timeout.minutes=20

# ==================== 日志输出 ====================
# Serenity 自身日志级别 - QUIET(只ERROR) / NORMAL(WARN+) / VERBOSE(INFO+)
# 注意（2026-09-28 起）：本框架的详细日志【不再】由本键控制 —— 改用下方 framework.verbose.logging。
# 本键当前仍决定 Serenity「录制/报告」相关行为（VerboseLogging.isRecordingEnabled），与日志门控已解耦。
framework.logging=VERBOSE

# ==================== Cucumber 严格模式 ====================
# 将 undefined/pending/ignored step 视为测试失败（而非静默通过）
# 修复：IDEA 中 Ignored Step 显示为 pass 的问题
cucumber.execution.strict=true

# 框架详细日志总开关（默认 false）
# false - 只输出【关键信息】：框架启停、浏览器初始化、会话读写/复用/过期、route 注册、
#         用例开始/结束/结果、失败与降级告警（直调 logger.info/warn/error 的部分）
# true  - 额外输出框架详细日志（logXxxIfVerbose）：逐场景过程、驱动细节、页面/采集细节等
# 说明：开启后只提升【本项目包】的 logger 级别（不会把第三方 DEBUG 一起放开）
framework.verbose.logging=false

# 框架超详细日志（trace 档，默认 false）：等同 verbose，并额外输出 trace 级
#framework.trace.logging=true

# ==================== 报告目录 ====================
# Serenity报告目录（相对路径，自动适用于本地和 Jenkins）
# SummaryReportGenerator 会自动检测环境并调整路径，无需手动配置
# 本地：使用 target/site/serenity
# Jenkins：自动转换为 ${WORKSPACE}/target/site/serenity
framework.output.directory=target/site/serenity

# ==================== 报告 URL ====================
# Serenity报告 URL（可选，SummaryReportGenerator 会自动检测）
# 在 Jenkins 中，SummaryReportGenerator 会自动从 ${BUILD_URL} 构建报告 URL
# 本地环境：使用相对链接 index.html
# 可以通过 -Dserenity.report.url 自定义 URL
#serenity.report.url=http://custom-url/reports

# ==================== Axe-core Accessibility 配置 ====================
# 基于 Deque axe-core 的 WCAG 无障碍合规性自动扫描
# 框架自动集成 AxeCoreListener，测试套件结束自动生成报告

# 是否启用 axe-core 扫描（全局开关）
axe.scan.enabled=true

# WCAG 合规标准标签（逗号分隔，留空则运行所有规则）
# 常用值：
#   wcag2a    - WCAG 2.0 A 级（基础无障碍）
#   wcag2aa   - WCAG 2.0 AA 级（推荐）
#   wcag21aa  - WCAG 2.1 AA 级
#   wcag22aa  - WCAG 2.2 AA 级（最新）
# 示例: wcag2a,wcag2aa
axe.scan.tags=

# 报告输出目录（运行时生成，可放 target/）
axe.scan.outputDir=target/accessibility-axe

serenity.requirements.types=capability,feature
serenity.console.colors=true

# ==================== 报告 URL 配置 ====================
# Summary 报告基础 URL（用于邮件中所有链接：View Full Report、Download ZIP/CSV、Scenario 链接）
# 支持环境变量占位符
#
# 示例：
#   serenity.report.url=${JENKINS_URL}job/${JOB_NAME}/${BUILD_NUMBER}/Serenity_20Summary_20Report/
#   解析后: http://jenkins.cli:8888/job/Playwright/47/Serenity_20Summary_20Report/
#
# ⚠️ View full report 按钮会链接到该 URL 下的 serenity-summary.html（即本页面自身）
serenity.report.url=${JENKINS_URL}job/${JOB_NAME}/${BUILD_NUMBER}/Serenity_20Report/

# ==================== 错误类型分类配置 ====================
# 用于 Summary Report 错误分类图（JSON 格式）
#
# 格式（单行 JSON）：
#   report.error.types=[{"label":"显示名","keywords":["关键字1","关键字2","..."]}, ...]
#
# 匹配逻辑：errorMessage 是否包含任一关键字（大小写不敏感，纯字符串 contains）
# 系统按顺序依次判断：用户配置优先 → 内置默认兜底 → 都未包含归入 "Other"
#
# 示例：
#   report.error.types=[{"label":"Api Issue","keywords":["ApiException","HTTP 500","502 Bad Gateway","4xx Client Error"]}, {"label":"Timeout Error","keywords":["TimeoutException","timed out","timeout"]}]
#
# 不配置此属性则仅使用内置默认分类（12类）
# 配置了会追加在默认规则之前（用户配置优先匹配）

report.error.types=[{"label":"Environment Issue","keywords":["Connection refused","database unavailable","config missing","service unreachable"]}, {"label":"Api Issue","keywords":["ApiException","API failed","HTTP 500","502 Bad Gateway","503 Service Unavailable","4xx Client Error","5xx Server Error","interface error"]}, {"label":"Navigation Failed","keywords":["NavigationTimeout","page not loaded","net::ERR_","loading failed"]}, {"label":"Element Not Found","keywords":["ElementNotFound","element not found","locator not found","selector not found"]}, {"label":"Assertion Failed","keywords":["AssertionError","expected but was","mismatch"]}, {"label":"Timeout Error","keywords":["TimeoutException","timed out","timeout"]}]

# ==================== BrowserStack 云测试配置 ====================
# 通过 CDP (Chrome DevTools Protocol) 连接 BrowserStack 云端浏览器
# 启用后无需修改测试代码，框架自动切换到远程浏览器
# 详细文档：BROWSERSTACK_INTEGRATION.md

# 是否启用 BrowserStack 云测试（全局开关）
browserstack.enabled=false

# BrowserStack 凭证（推荐使用环境变量 BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY）
browserstack.username=
browserstack.accessKey=

# Dashboard 会话名称（推荐通过 -Dbrowserstack.sessionName 按场景设置）
browserstack.sessionName=

# 操作系统与版本
browserstack.os=Windows
browserstack.osVersion=11

# 浏览器名称（chrome / firefox / webkit / edge）
# 注意：CDP 协议仅支持 Chromium 系浏览器；Firefox/WebKit 使用 Playwright 自有协议
browserstack.browserName=chrome

# 浏览器版本（latest 或指定版本如 120.0）
browserstack.browserVersion=latest

# 连接超时（秒）
browserstack.timeout=300

# 调试模式（true=步骤级截图，仅限调试使用）
browserstack.debug=true

# 网络日志（true=捕获 HTTP 请求/响应）
browserstack.networkLogs=true

# 视频录制（true=录制测试过程）
browserstack.video=true

# BrowserStack Local Testing（访问内网/本地应用时启用）
# 启用后，框架自动启动 BrowserStackLocal 二进制建立安全隧道
# 需要先下载 BrowserStackLocal: https://www.browserstack.com/local-testing/automate
browserstack.local=false

# Local 隧道标识符（留空自动生成）
browserstack.local.identifier=

# BrowserStackLocal 二进制文件路径（留空则在 PATH 中查找）
# Windows 示例: D:/tools/BrowserStackLocal.exe
browserstack.local.path=

# Local 隧道启动超时（秒）
browserstack.local.timeout=30

# CDP/Playwright WebSocket 端点域名
# 公司网络下如果 cdp.browserstack.com DNS 无法解析，可改为可解析的域名
# Local 模式下（browserstack.local=true）仍然使用此端点连接云端，
# 由 force.local=true capability 告知 BrowserStack 云端将流量路由到本地隧道
browserstack.cdp.endpoint=

# ==================== API Monitor 数据库存储配置 ====================
# 是否启用 Monitor API 响应数据库持久化存储（默认 false，不存储）
monitor.db.store.enabled=false

# 数据库类型: MYSQL, POSTGRESQL
monitor.db.type=MYSQL

# 数据库连接 URL（示例，请根据实际环境修改）
monitor.db.url=jdbc:mysql://localhost:3306/route_monitor?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# 数据库用户名
monitor.db.user=

# 数据库密码
monitor.db.password=

# 数据库连接池最大连接数
monitor.db.pool.max.size=5

# ==================== API Monitor 文件存储配置 ====================
# 是否启用 Monitor API 响应文件持久化存储（默认 false，不存储）
# 启用后，每次捕获的 API 响应会以 JSON 写入文件：
#   文件名以 endpoint（api() 配置的 urlPattern）命名；
#   同一 endpoint 多次捕获自动编号：<endpoint>.json、<endpoint>_1.json、<endpoint>_2.json …
monitor.file.store.enabled=false

# 文件输出目录（相对路径基于工作目录，也可填绝对路径）
monitor.file.store.dir=target/monitor-output

# 是否美化 JSON 输出（true=格式化，false=单行压缩）
monitor.file.store.pretty=true

# 是否按 Serenity scenario（用例）分组存储（默认 true）
# true=每个用例写入独立子目录，序号在该用例开始时自动重置（不同 case 互不干扰，不串号、不覆盖）
# false=所有文件平铺在输出目录，序号在整个 JVM 运行内累计（旧行为）
monitor.file.store.group.by.scenario=true

